name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Audit release boundaries
        run: ./scripts/release-audit.sh

      - name: Check formatting
        run: xcrun swift-format lint --recursive Sources Tests Package.swift

      - name: Build debug
        run: swift build

      - name: Build optimized release
        run: swift build -c release

      - name: Run unit tests
        run: swift test

      - name: Run portable integration self-test
        run: swift run sensorlab-selftest --portable

      - name: Assemble and verify optimized app bundle
        run: ./scripts/build-app.sh release
