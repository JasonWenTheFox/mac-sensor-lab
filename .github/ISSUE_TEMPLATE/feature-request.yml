name: Feature request
description: Suggest a measurement, interpretation, provider, or workflow.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to understand or measure?
      description: Describe the real-world question before proposing a sensor or UI.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sensor or data-source idea
      description: If known, explain the source, calibration needs, permissions, and unsupported cases.
  - type: dropdown
    id: nature
    attributes:
      label: Intended result
      options:
        - Raw sensor access
        - Human-readable visualization
        - Derived or estimated experiment
        - Export or diagnostics workflow
        - Other
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundary
      options:
        - label: I understand that measurement claims require provenance, calibration, and uncertainty labels.
          required: true
